# Запуск сервиса распознавания. Фронтенд (web/) поднимается отдельно
# командой npm run dev — он нужен только для демонстрации интерфейса.
#
#   docker compose up --build
#
# Перед сервисом api одноразовый сервис indexer собирает из датасета кейса
# (dataset/) каталог и индексы в data/, если их там ещё нет; повторные
# старты его пропускают. Датасет раскладывается по README, «Данные».
#
# Секция deploy.resources требует установленного nvidia-container-toolkit.
# Без видеокарты — процессорная сборка без резервирования GPU:
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up --build

# Имя проекта фиксировано: тома hf-cache (веса моделей, около 13 ГБ) и
# pg-data не зависят от имени папки клона.
name: rus_vines

x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: 1
          capabilities: [gpu]

services:
  indexer:
    build:
      context: .
      dockerfile: service/Dockerfile
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu128}
    image: rus_vines-api
    command: ["bash", "scripts/build_artifacts.sh"]
    volumes:
      # Единственный сервис, которому data/ доступна на запись.
      - ./data:/app/data
      - ./dataset:/app/dataset:ro
      - hf-cache:/root/.cache/huggingface
    environment:
      PYTHON: python
      HF_HOME: /root/.cache/huggingface
      YOLO_WEIGHTS: /app/weights/yolo11m.pt
    deploy: *gpu

  api:
    build:
      context: .
      dockerfile: service/Dockerfile
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu128}
    image: rus_vines-api
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Каталог, векторный индекс и признаки эталонов монтируются, а не
      # копируются в образ: они пересобираются чаще, чем меняется код.
      - ./data:/app/data:ro
      - ./dataset:/app/dataset:ro
      # Веса SigLIP (около 3.5 ГБ) кэшируются между перезапусками.
      - hf-cache:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
      YOLO_WEIGHTS: /app/weights/yolo11m.pt
      # Векторы индекса и карточки — в PostgreSQL с pgvector, как на целевой
      # платформе; при первом старте сервис сам загружает туда индекс из
      # data/index и перезагружает его после пересборки (сверка по хешу).
      VECTOR_BACKEND: pgvector
      DATABASE_URL: postgresql://wine:wine@db:5432/wine
      # Спасение отказа по этикетке (service/main.py, README): включено;
      # LABEL_RESCUE=0 docker compose up — выключить.
      LABEL_RESCUE: ${LABEL_RESCUE:-1}
      LABEL_RESCUE_BUDGET_MS: ${LABEL_RESCUE_BUDGET_MS:-0}
      # Проверка лидера VLM в полосе «скорее всего» (service/main.py, README):
      # включена; VLM_BAND_VETO=0 docker compose up — выключить.
      VLM_BAND_VETO: ${VLM_BAND_VETO:-1}
      # Какой вид кадра видит VLM: auto — целый кадр, если вырезка детектора
      # разминулась с точками лидера; detect — всегда вырезка.
      VLM_VIEW: ${VLM_VIEW:-auto}
    depends_on:
      indexer:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    deploy: *gpu
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Первый старт скачивает в том hf-cache веса SigLIP 2 и Qwen3-VL
      # (около 13 ГБ) — это до десяти минут; раньше контейнер на это время
      # помечался нездоровым. Повторные старты — около минуты.
      start_period: 1800s

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wine
      POSTGRES_PASSWORD: wine
      POSTGRES_DB: wine
    # Порт 5433 на хосте — только для отладки (pipeline/vector_store.py --check);
    # api ходит в базу по внутренней сети compose.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wine -d wine"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  hf-cache:
  pg-data:
