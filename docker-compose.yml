# Запуск сервиса распознавания. Фронтенд (web/) поднимается отдельно
# командой npm run dev — он нужен только для демонстрации интерфейса.
#
#   docker compose up --build
#
# Секция deploy.resources требует установленного nvidia-container-toolkit.
# Без GPU уберите её и пересоберите образ с процессорной сборкой torch:
#   docker compose build --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cpu
services:
  api:
    build:
      context: .
      dockerfile: service/Dockerfile
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu128}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Каталог, векторный индекс и признаки эталонов монтируются, а не
      # копируются в образ: они пересобираются чаще, чем меняется код.
      - ./data:/app/data:ro
      - ./dataset:/app/dataset:ro
      # Веса SigLIP (около 3.5 ГБ) кэшируются между перезапусками.
      - hf-cache:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
      YOLO_WEIGHTS: /app/weights/yolo11m.pt
      # Векторы индекса и карточки — в PostgreSQL с pgvector, как на целевой
      # платформе; при первом старте сервис сам загружает туда индекс из
      # data/index и перезагружает его после пересборки (сверка по хешу).
      VECTOR_BACKEND: pgvector
      DATABASE_URL: postgresql://wine:wine@db:5432/wine
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Первый старт скачивает в том hf-cache веса SigLIP 2 и Qwen3-VL
      # (около 13 ГБ) — это до десяти минут; раньше контейнер на это время
      # помечался нездоровым. Повторные старты — около минуты.
      start_period: 1800s

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wine
      POSTGRES_PASSWORD: wine
      POSTGRES_DB: wine
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wine -d wine"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  hf-cache:
  pg-data:
