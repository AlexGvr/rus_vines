services:
  api:
    build:
      context: .
      dockerfile: service/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Индекс, каталог и веса монтируются, а не копируются в образ:
      # индекс пересобирается чаще, чем меняется код сервиса.
      - ./data:/app/data:ro
      - ./dataset:/app/dataset:ro
      - hf-cache:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  hf-cache:
